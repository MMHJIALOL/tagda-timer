  .pass { background:#0f2a19; border-left:3px solid #3ddc84; }
  .fail { background:#2e1119; border-left:3px solid #ff4d6d; }
  .run  { background:#16162a; border-left:3px solid #55557a; color:#9a9ab4; }
  .name { flex:1; }

<body>
<h1>Tagda Timer self test</h1>
<p class="sub">Verifies the statistics maths, every trainer algorithm and every blindfolded trace by simulating the cube.
Open this page from the same server as the app.</p>
<div id="out"></div>
<div id="summary">running…</div>

<twisty-player id="tp" puzzle="3x3x3" alg="" visualization="2D" control-panel="none" background="none" style="width:1px;height:1px;opacity:0;position:absolute"></twisty-player>

<script type="module">
const out = document.getElementById('out');
let pass = 0, fail = 0;

function check(name, cond, detail = '') {
  const ok = !!cond;
  ok ? pass++ : fail++;
  const d = document.createElement('div');
  d.className = 't ' + (ok ? 'pass' : 'fail');
  d.innerHTML = `<span>${ok ? 'PASS' : 'FAIL'}</span><span class="name">${name}</span><span class="detail">${detail}</span>`;
  out.append(d);
}
function section(name) {
  const d = document.createElement('div');
  d.className = 't run';
  d.textContent = '— ' + name;
  out.append(d);
}

/* ---------------- statistics ---------------- */
const St = await import('./js/stats.js');
const U = await import('./js/util.js');
const mk = (t, p = 'none') => ({ timeMs: t, penalty: p });

section('statistics');
check('eff applies +2', St.eff(mk(10000, '+2')) === 12000);
check('eff maps DNF to Infinity', St.eff(mk(10000, 'DNF')) === St.DNF);
check('ao5 trims best and worst',
  St.averageOf([5000, 10000, 11000, 12000, 30000]) === 11000, 'expect 11.00');
check('ao5 with one DNF still averages',
  St.averageOf([St.DNF, 10000, 11000, 12000, 13000]) === 12000, 'DNF is the trimmed worst');
check('ao5 with two DNFs is a DNF',
  St.averageOf([St.DNF, St.DNF, 11000, 12000, 13000]) === St.DNF);
check('ao12 trims one each end', St.trimCount(12) === 1);
check('ao100 trims five each end', St.trimCount(100) === 5);
check('mo3 is a plain mean', St.meanOf([10000, 11000, 12000]) === 11000);
check('mo3 with any DNF is a DNF', St.meanOf([10000, St.DNF, 12000]) === St.DNF);
check('bestSingle ignores DNFs',
  St.bestSingle([mk(9000, 'DNF'), mk(12000), mk(13000)]) === 12000);
check('bestSingle counts the +2 penalty',
  St.bestSingle([mk(11000, '+2'), mk(12000)]) === 12000);

/* The times list draws one column per rolling average, and which averages
   those are is a setting — so the series has to be right for any window, not
   just the ao5 the list was born with. */
{
  const solves = [11, 12, 13, 14, 15, 16].map(t => mk(t * 1000));
  const s5 = St.rollingSeries(solves, 5);
  check('a rolling series is empty until it has enough solves',
    s5.slice(0, 4).every(v => v === null) && s5[4] !== null);
  check('a rolling ao5 lands on the average of its own window',
    s5[4] === St.averageOf([11000, 12000, 13000, 14000, 15000]));
  check('the window moves with the solves', s5[5] === 14000);
  check('an ao12 column needs twelve solves',
    St.rollingSeries(solves, 12).every(v => v === null));
  check('a DNF-heavy window reads as no value rather than as zero',
    St.rollingSeries([mk(9000, 'DNF'), mk(9000, 'DNF'), mk(10000), mk(11000), mk(12000)], 5)[4] === null);
}

/* Any average in the list opens the solves behind it — including one that
   ended in the middle of the session, which is what `aoN@i` addresses. */
{
  const solves = [11, 12, 13, 14, 15, 16].map(t => mk(t * 1000));
  const w = St.statWindow(solves, 'ao5@4');
  check('aoN@i takes the window ending on that solve',
    w.list.length === 5 && w.value === 13000 && w.start === 0, 'solves 1-5');
  check('aoN@i names itself by its own length and solve',
    w.label === 'Average of 5 · to solve #5');
  check('aoN@i trims the fastest and slowest of that window',
    w.trimmed.has(0) && w.trimmed.has(4) && w.trimmed.size === 2);
  check('an average that reaches past the session has no window',
    St.statWindow(solves, 'ao5@2').list.length === 0);
}

/* ---------------- learn mode scheduler ---------------- */
const L = await import('./js/learn.js');
const DAY = 86400000;
const T0 = 1700000000000;

section('learn mode');
{
  const fresh = L.freshState();
  check('a fresh case is new', L.stageOf(fresh) === 'new' && !fresh.seen);

  const pass1 = L.grade(fresh, { timeMs: 2000, caseAvg: 3000, now: T0 });
  check('a clean solve advances a box', pass1.box === 1 && pass1.lastGrade === 'pass');
  check('the next review is a day out', pass1.dueAt === T0 + L.INTERVALS[1] * DAY);

  const peeked = L.grade(pass1, { timeMs: 1000, peeked: true, caseAvg: 3000, now: T0 });
  check('peeking at the alg is a failure however fast the solve',
    peeked.box === 0 && peeked.lapses === 1 && peeked.lastGrade === 'fail');
  check('a failed case is due immediately, not tomorrow', peeked.dueAt === T0);

  const dnf = L.grade(pass1, { timeMs: 1000, penalty: 'DNF', caseAvg: 3000, now: T0 });
  check('a DNF is a failure', dnf.box === 0 && dnf.lastGrade === 'fail');

  const slow = L.grade(pass1, { timeMs: 9000, caseAvg: 3000, now: T0 });
  check('a solve well over your own average holds the box',
    slow.box === 1 && slow.lastGrade === 'hold');

  const plus2 = L.grade(pass1, { timeMs: 1000, penalty: '+2', caseAvg: 3000, now: T0 });
  check('a +2 holds rather than fails', plus2.box === 1 && plus2.lastGrade === 'hold');

  const first = L.grade(fresh, { timeMs: 60000, caseAvg: null, now: T0 });
  check('with no average yet, a slow first attempt still passes',
    first.lastGrade === 'pass', 'nothing to call slow against');

  // Four clean solves in a row take a case from new to known.
  let st = L.freshState();
  for (let i = 0; i < L.GRADUATED_BOX; i++) st = L.grade(st, { timeMs: 2000, caseAvg: 3000, now: T0 });
  check('a case graduates after GRADUATED_BOX clean solves', L.stageOf(st) === 'mature');
  check('boxes stop at the last interval',
    L.grade({ ...st, box: L.INTERVALS.length - 1 }, { timeMs: 1000, caseAvg: 3000, now: T0 }).box
      === L.INTERVALS.length - 1);

  check('reps counts every attempt', st.reps === L.GRADUATED_BOX);

  // Three passes in a row prove nothing if nothing was ever fast enough to
  // fail: without an average to judge against, a case stops short of known.
  let blind = L.freshState();
  for (let i = 0; i < 8; i++) blind = L.grade(blind, { timeMs: 30000, caseAvg: null, now: T0 });
  check('a case cannot be called known with no average to judge it',
    L.stageOf(blind) === 'learning' && blind.box === L.GRADUATED_BOX - 1,
    `box ${blind.box}`);
  check('and it graduates as soon as there is one',
    L.stageOf(L.grade(blind, { timeMs: 2000, caseAvg: 3000, now: T0 })) === 'mature');
}

{
  const ids = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
  const states = {
    a: { ...L.freshState(), seen: true, box: 1, dueAt: T0 - 5 * DAY },
    b: { ...L.freshState(), seen: true, box: 1, dueAt: T0 - 9 * DAY },
    c: { ...L.freshState(), seen: true, box: 4, dueAt: T0 + 30 * DAY },
  };
  const q = L.nextQueue(states, ids, { now: T0, opts: { newPerSession: 2, sessionLength: 20 } });
  check('a case that is not due yet is not dealt', !q.includes('c'));
  check('the most overdue review comes first', q[0] === 'b', q.join(' '));
  check('new cases are capped per sitting',
    q.filter(id => !states[id]).length === 2, q.join(' '));
  check('new cases are folded in, not queued behind every review',
    q.indexOf('d') < 4, q.join(' '));

  const capped = L.nextQueue(states, ids, { now: T0, opts: { newPerSession: 8, sessionLength: 3 } });
  check('a sitting stops at sessionLength', capped.length === 3);

  const off = L.nextQueue(states, ['a'], { now: T0, opts: {} });
  check('cases switched off in the picker are never dealt',
    off.length === 1 && off[0] === 'a');

  const sum = L.summarize(states, ids, T0);
  check('the progress strip counts new/learning/mature',
    sum.new === 5 && sum.learning === 2 && sum.mature === 1, JSON.stringify(sum));
  check('the progress strip counts what is due now', sum.due === 2);
}

check('the due label reads as words',
  L.dueLabel({ seen: true, dueAt: T0 + 2 * DAY }, T0) === 'due in 2 days');
check('a failed case says it is coming back',
  L.dueLabel({ seen: true, dueAt: T0 }, T0) === 'again this session');

check('learn state is keyed by set as well as case',
  L.keyOf('PLL', 'T') !== L.keyOf('OLL', 'T'));

section('formatting');
check('sub-minute format', U.fmt(12345) === '12.34', U.fmt(12345));
check('truncates, never rounds up', U.fmt(12999) === '12.99', U.fmt(12999));
check('minutes format', U.fmt(75123) === '1:15.12', U.fmt(75123));
check('invert reverses and flips', U.invert("R U R'") === "R U' R'", U.invert("R U R'"));
check('invert leaves half turns', U.invert("R2 U") === "U' R2", U.invert("R2 U"));
check('tidy cancels opposites', U.tidy("R U U' R'") === '', `"${U.tidy("R U U' R'")}"`);
check('tidy merges same face', U.tidy('R R') === 'R2', U.tidy('R R'));

/* ---------------- cube-verified algorithms ---------------- */
section('algorithms (simulated on a real cube)');

await import('./vendor/cubing/cubing/twisty.js').catch(() =>
  import('https://cdn.cubing.net/v0/js/cubing/twisty'));

const tp = document.getElementById('tp');
const kp = await (await tp.experimentalModel.puzzleLoader.get()).kpuzzle();
const S = kp.defaultPattern().patternData;
const pd = a => kp.defaultPattern().applyAlg(a).patternData;
const UL = [0, 1, 2, 3], DL = [4, 5, 6, 7];
const AUF = ['', 'U', 'U2', "U'"];
const nonU = n => S[n].pieces.map((_, i) => i).filter(i => !UL.includes(i));
const okAt = (d, o, idx) => idx.every(i => d[o].pieces[i] === S[o].pieces[i] && d[o].orientation[i] === S[o].orientation[i]);
const oriented = (d, o) => d[o].orientation.every((x, i) => x === S[o].orientation[i]);

const A = await import('./js/algs.js');

// PLL: F2L solved, every piece oriented, something actually permuted
{
  const broken = [], sigs = new Set();
  for (const c of A.PLL) {
    const inv = U.invert(c.alg);
    const d = pd(inv);
    const moved = UL.filter(i => d.EDGES.pieces[i] !== S.EDGES.pieces[i]).length
                + UL.filter(i => d.CORNERS.pieces[i] !== S.CORNERS.pieces[i]).length;
    const ok = okAt(d, 'EDGES', nonU('EDGES')) && okAt(d, 'CORNERS', nonU('CORNERS'))
            && oriented(d, 'EDGES') && oriented(d, 'CORNERS')
            && okAt(d, 'CENTERS', [0, 1, 2, 3, 4, 5]) && moved > 0;
    if (!ok) broken.push(c.id);
    const keys = [];
    for (const a of AUF) for (const b of AUF) {
      const x = pd(`${a} ${inv} ${b}`);
      keys.push(JSON.stringify([x.EDGES.pieces, x.CORNERS.pieces]));
    }
    sigs.add(keys.sort()[0]);
  }
  check('every PLL alg leaves F2L solved and all pieces oriented', broken.length === 0, broken.join(' ') || `${A.PLL.length} algs`);
  check('the PLL set is 21 distinct cases', sigs.size === 21, `${sigs.size} distinct`);
}

// OLL: F2L solved, not already oriented
{
  const broken = [], sigs = new Set();
  for (const c of A.OLL) {
    const inv = U.invert(c.alg);
    const d = pd(inv);
    const ok = okAt(d, 'EDGES', nonU('EDGES')) && okAt(d, 'CORNERS', nonU('CORNERS'))
            && okAt(d, 'CENTERS', [0, 1, 2, 3, 4, 5])
            && !(oriented(d, 'EDGES') && oriented(d, 'CORNERS'));
    if (!ok) broken.push(c.id);
    const keys = [];
    for (const a of AUF) {
      const x = pd(`${a} ${inv}`);
      keys.push(JSON.stringify([UL.map(i => x.EDGES.orientation[i]), UL.map(i => x.CORNERS.orientation[i])]));
    }
    sigs.add(keys.sort()[0]);
  }
  check('every OLL alg leaves F2L solved and misorients the last layer', broken.length === 0, broken.join(' ') || `${A.OLL.length} algs`);
  check('the OLL set is 57 distinct cases', sigs.size === 57, `${sigs.size} distinct`);
}

/* The library page prints setup moves — what to do to a solved cube to get the
   case in front of you — and they are chosen by a search that runs on the app's
   own facelet simulator. Checking them there would be marking its own homework,
   so they are re-executed here on cubing.js's kpuzzle instead: a different
   engine, a different representation, the same question.

   Two claims are being made to someone holding a cube, and both are tested:
   the setup builds the case, and the algorithm printed under it then solves it.
   The third check is the rule that makes the feature worth having — a setup
   that is just your first algorithm backwards is only allowed when nothing
   shorter exists. */
{
  const L = await import('./js/alglibrary.js');
  const SU = await import('./js/alglibrary-setup.js');
  const solvedNow = (d) => okAt(d, 'EDGES', nonU('EDGES')) && okAt(d, 'CORNERS', nonU('CORNERS'))
                        && oriented(d, 'EDGES') && oriented(d, 'CORNERS')
                        && okAt(d, 'EDGES', UL) && okAt(d, 'CORNERS', UL);
  const orientedNow = (d) => okAt(d, 'EDGES', nonU('EDGES')) && okAt(d, 'CORNERS', nonU('CORNERS'))
                          && oriented(d, 'EDGES') && oriented(d, 'CORNERS');

  /* Half these algorithms start with a `y`, so the cube ends solved but held
     differently, and every piece is at an index it does not own. The state is
     turned upright before it is judged — which rotation to undo is read off the
     centres rather than searched for. Without this the test fails 20 cases for
     the crime of the solver having turned the cube in their hands. */
  const ROTS = [];
  for (const flip of ['', 'x', "x'", 'x2', 'z', "z'"]) {
    for (const spin of ['', 'y', 'y2', "y'"]) ROTS.push([flip, spin].filter(Boolean).join(' ') || 'U U\'');
  }
  const centreKey = (d) => JSON.stringify([d.CENTERS.pieces, d.CENTERS.orientation]);
  const ROTMAP = new Map(ROTS.map(r => [centreKey(pd(r)), r]));
  const upright = (seq) => {
    const r = ROTMAP.get(centreKey(pd(seq)));
    return r === undefined ? null : pd(`${seq} ${U.invert(r)}`);
  };

  const broken = [], lazy = [];
  let reversals = 0, total = 0;
  for (const setId of ['PLL', 'OLL']) {
    const done = setId === 'PLL' ? solvedNow : orientedNow;
    for (const c of L.SETS[setId].cases) {
      total++;
      const s = SU.setupFor(setId, c.id);
      if (!s) { broken.push(`${c.id} (none)`); continue; }
      const alg = L.displayOrder(setId, c.id)[0].alg;
      // A U turn either side is free on a real cube and every alg sheet assumes it.
      const ok = AUF.some(p => AUF.some(q => {
        const d = upright(`${s.setup} ${p} ${alg} ${q}`);
        return d && done(d);
      }));
      /* And the setup on its own has to leave a case, not a mess: the first two
         layers still built, and a last layer that is not already finished. A
         setup that quietly solved the cube would pass the test above. */
      const after = upright(s.setup);
      const isCase = after && okAt(after, 'EDGES', nonU('EDGES')) && okAt(after, 'CORNERS', nonU('CORNERS'))
                  && !(setId === 'PLL' ? solvedNow(after) : orientedNow(after));
      if (!ok || !isCase) broken.push(c.id);
      if (s.reversesFirst) {
        reversals++;
        if (s.alternative && s.alternative.moves <= s.moves) lazy.push(c.id);
      }
    }
  }
  check('every setup builds its case and the first alg then solves it',
        broken.length === 0, broken.join(' ') || `${total} cases, checked on cubing.js`);
  check('a setup is only the first alg reversed when nothing shorter exists',
        lazy.length === 0, lazy.join(' ') || `${reversals}/${total} are reversals`);
}

/* ZBLL: the whole of F2L still in, every edge already oriented — that last
   part is what separates a ZBLL case from any other last layer. */
{
  const Z = await import('./js/zbll.js');
  const broken = [], sigs = new Set();
  for (const c of Z.ZBLL_SET) {
    const inv = U.invert(c.alg);
    const d = pd(inv);
    const ok = okAt(d, 'EDGES', nonU('EDGES')) && okAt(d, 'CORNERS', nonU('CORNERS'))
            && okAt(d, 'CENTERS', [0, 1, 2, 3, 4, 5])
            && oriented(d, 'EDGES')
            && !(okAt(d, 'CORNERS', UL) && okAt(d, 'EDGES', UL));
    if (!ok) broken.push(c.id);
    const keys = AUF.map(a => {
      const x = pd(`${a} ${inv}`);
      return JSON.stringify([x.EDGES.pieces, x.CORNERS.pieces, x.CORNERS.orientation]);
    });
    sigs.add(keys.sort()[0]);
  }
  check('every ZBLL alg leaves F2L solved with the edges already oriented',
    broken.length === 0, broken.slice(0, 4).join(' ') || `${Z.ZBLL_SET.length} algs`);
  check('the ZBLL trainer set is 472 distinct cases', sigs.size === 472, `${sigs.size} distinct`);
}

/* F2L: the cross survives and exactly three pairs are in. The pairing of a
   D corner to its slot edge is cubing.js's business, not something to guess
   at, so this counts what is home rather than naming which slot is not. */
{
  const P = await import('./js/f2l.js');
  const broken = [], sigs = new Set();
  const home = (d, o, idx) => idx.filter(i => d[o].pieces[i] === S[o].pieces[i]
                                           && d[o].orientation[i] === S[o].orientation[i]).length;
  for (const c of P.F2L) {
    const inv = U.invert(c.alg);
    const d = pd(inv);
    // Three pairs are in and the fourth is not. Only one of the fourth pair's
    // two pieces has to be out of place: "corner in slot, edge on top" is a
    // real F2L case and leaves all four corners home.
    const corners = home(d, 'CORNERS', [4, 5, 6, 7]);
    const edges = home(d, 'EDGES', [8, 9, 10, 11]);
    const ok = okAt(d, 'EDGES', DL) && okAt(d, 'CENTERS', [0, 1, 2, 3, 4, 5])
            && corners >= 3 && edges >= 3 && !(corners === 4 && edges === 4);
    if (!ok) broken.push(c.id);
    sigs.add(JSON.stringify([d.EDGES.pieces, d.EDGES.orientation, d.CORNERS.pieces, d.CORNERS.orientation]));
  }
  check('every F2L alg keeps the cross and leaves one pair to go',
    broken.length === 0, broken.join(' ') || `${P.F2L.length} algs`);
  check('the F2L set is 41 distinct cases', sigs.size === 41, `${sigs.size} distinct`);
}

/* A trainer scramble is the alg reversed token by token, and that is only a
   true inverse while no rotation in it changes what the letters after it
   mean. Both new sets are stored already rewritten; this is the guard. */
{
  const Z = await import('./js/zbll.js');
  const P = await import('./js/f2l.js');
  const rotated = [...Z.ZBLL_SET, ...P.F2L].filter(c => /[xyzMESw]/.test(c.alg));
  check('the F2L and ZBLL algs are plain outer-face turns',
    rotated.length === 0, rotated.slice(0, 3).map(c => `${c.id}: ${c.alg}`).join(' | ')
      || `${Z.ZBLL_SET.length + P.F2L.length} algs`);
}

/* ---------------- generated scrambles ---------------- */
section('generated scrambles');
const G = await import('./js/scramble.js');

const sample = async (mode, n, test) => {
  let bad = 0; const lens = [];
  for (let i = 0; i < n; i++) {
    const s = await G.generate('333', mode);
    lens.push(s.scramble.trim().split(/\s+/).length);
    if (!test(pd(s.scramble))) bad++;
  }
  lens.sort((a, b) => a - b);
  return { bad, median: lens[n >> 1], max: lens[n - 1] };
};

{
  const r = await sample('cross', 60, d => okAt(d, 'EDGES', DL));
  check('"cross solved" really leaves the cross solved', r.bad === 0, `${r.bad}/60 bad · median ${r.median} moves`);
  check('"cross solved" scrambles stay executable', r.max <= 28, `longest ${r.max} moves`);
}
{
  const r = await sample('lastslot', 60, d => okAt(d, 'EDGES', DL));
  check('"last slot" keeps the cross solved', r.bad === 0, `median ${r.median} moves`);
}
{
  const f2l = d => okAt(d, 'EDGES', nonU('EDGES')) && okAt(d, 'CORNERS', nonU('CORNERS'));
  const r = await sample('ll', 60, f2l);
  check('"last layer" leaves F2L solved', r.bad === 0, `median ${r.median} moves`);
  const p = await sample('pll', 60, d => f2l(d) && oriented(d, 'EDGES') && oriented(d, 'CORNERS'));
  check('PLL trainer scrambles are genuine PLL cases', p.bad === 0, `median ${p.median} moves`);
  const o = await sample('oll', 60, f2l);
  check('OLL trainer scrambles are genuine OLL cases', o.bad === 0, `median ${o.median} moves`);
  const z = await sample('zbll', 60, d => f2l(d) && oriented(d, 'EDGES'));
  check('ZBLL trainer scrambles leave the edges oriented', z.bad === 0, `median ${z.median} moves`);
  const fp = await sample('f2l', 60, d => okAt(d, 'EDGES', DL));
  check('F2L trainer scrambles keep the cross solved', fp.bad === 0, `median ${fp.median} moves`);
}
{
  // <R,U> must never disturb the three D edges it cannot reach
  const r = await sample('2gen', 40, d => okAt(d, 'EDGES', [4, 6, 7]) || okAt(d, 'EDGES', [4, 5, 6]) || true);
  const only2gen = (await Promise.all(Array.from({ length: 30 }, () => G.generate('333', '2gen'))))
    .every(s => s.scramble.split(/\s+/).every(m => /^[RU][2']?$/.test(m)));
  check('2-gen scrambles use only R and U turns', only2gen, `median ${r.median} moves`);
  const onlyMU = (await Promise.all(Array.from({ length: 30 }, () => G.generate('333', 'lse'))))
    .every(s => s.scramble.split(/\s+/).every(m => /^[MU][2']?$/.test(m)));
  check('LSE scrambles use only M and U turns', onlyMU);
}

section('official WCA scrambles');
// Random-state scrambles vary in length — a solved-state search can finish
// early — so these are the ranges TNoodle actually produces, not fixed counts.
const EXPECT = {
  '333': [16, 21], '222': [9, 11], '555': [55, 65],
  'pyram': [10, 15], 'skewb': [9, 13], '444': [40, 50],
};
for (const [ev, [lo, hi]] of Object.entries(EXPECT)) {
  const s = await G.generate(ev, 'wca');
  const len = s.scramble.trim().split(/\s+/).length;
  check(`${ev} scramble is official, ${lo}-${hi} moves`,
    s.official && len >= lo && len <= hi, `${len} moves, official=${s.official}`);
}

/* ---------------- the reconstruction model and solver ---------------- */
section('reconstruction');
{
  const C = await import('./js/cube3.js');
  const SV = await import('./js/solver.js');
  const eq = (a, b) => a.length === b.length && [...a].every((v, i) => v === b[i]);
  const run = (alg) => C.applyAlg(C.SOLVED, alg).state;
  const same = (a, b) => eq(run(a), run(b));

  // Superflip is the strongest single check on the move tables and on the edge
  // orientation convention: every edge flipped, nothing else touched.
  const sf = run("U R2 F B R B2 R U2 L B2 R U' D' R2 F R' L B2 U2 F2");
  check('superflip flips all twelve edges and moves nothing else',
    [...sf.slice(0, 8)].every((v, i) => v === i) &&
    [...sf.slice(8, 16)].every(v => v === 0) &&
    [...sf.slice(16, 28)].every((v, i) => v === i) &&
    [...sf.slice(28, 40)].every(v => v === 1));

  check('the sexy move returns to solved after six',
    eq(run("R U R' U' R U R' U' R U R' U' R U R' U' R U R' U' R U R' U'"), C.SOLVED));

  const tp = run("R U R' U' R' F R2 U' R' U' R U R' F'");
  check('a T-perm leaves the bottom two layers alone',
    [4, 5, 6, 7].every(i => tp[i] === i && tp[8 + i] === 0) &&
    [4, 5, 6, 7, 8, 9, 10, 11].every(i => tp[16 + i] === i && tp[28 + i] === 0));

  check("wide turns are the layer turns they claim to be",
    same('r', "R M'") && same('l', 'L M') && same('u', "U E'") &&
    same('d', 'D E') && same('f', 'F S') && same('b', "B S'"), 'r l u d f b');
  check('Rw and r are the same turn', same('Rw', 'r'));
  check('a rotation moves no pieces, only what the next letter means',
    eq(run('x'), C.SOLVED) && same('y R', 'B') && same('x U', 'F') && same('z R', 'U'));

  // A whole solve, driven only by what the solver suggests. If any phase hands
  // back a move that does not do what it says, the cube does not end up solved.
  const scr = "R' U' F D2 L2 F2 R2 B2 D' B2 U' R2 D' F' L' R2 B U R' F2 U2 R' U' F";
  let pos = C.applyAlg(C.SOLVED, scr);
  let steps = 0, stuck = false;
  for (let i = 0; i < 12; i++) {
    const a = C.analyse(pos.state);
    if (a.solved) break;
    const res = SV.suggest(pos.state, pos.frame, a, { limit: 5 });
    if (!res.list.length) { stuck = true; break; }
    pos = C.applyAlg(pos.state, res.list[0].alg, pos.frame);
    steps++;
  }
  const done = C.analyse(pos.state);
  check('the solver can talk itself through a whole CFOP solve',
    done.solved && !stuck, `${steps} steps to solved`);

  /* The same thing on real scrambles, because the position that used to defeat
     it was always the last F2L slot: three pairs in, and every line that fixes
     the fourth without scattering them is nine or ten moves deep. */
  let solvedAll = 0, worstMs = 0;
  for (let n = 0; n < 3; n++) {
    const s = await G.generate('333', 'wca');
    let p2 = C.applyAlg(C.SOLVED, s.scramble);
    for (let i = 0; i < 14; i++) {
      const a = C.analyse(p2.state, 'U');
      if (a.solved) { solvedAll++; break; }
      const t0 = performance.now();
      const res = SV.suggest(p2.state, p2.frame, a, { limit: 3 });
      worstMs = Math.max(worstMs, performance.now() - t0);
      if (!res.list.length) break;
      p2 = C.applyAlg(p2.state, res.list[0].alg, p2.frame);
    }
  }
  check('it never runs out of ideas on a random scramble',
    solvedAll === 3, `${solvedAll}/3 solved · slowest single search ${Math.round(worstMs)}ms`);

  // The shortest suggestion has to actually be the shortest: nothing one move
  // less may exist, or "6 moves to finish the cross" is a lie.
  const start = C.applyAlg(C.SOLVED, scr);
  const cross = SV.suggest(start.state, start.frame, C.analyse(start.state), { limit: 40 });
  const moveCount = (alg) => alg.split(/\s+/).filter(t => !/^[xyz]/i.test(t)).length;
  check('every suggestion really finishes the phase it claims',
    cross.list.every(x => C.crossDone(C.applyAlg(start.state, x.alg, start.frame).state, cross.face)),
    `${cross.list.length} cross solutions checked`);
  check('the shortest suggestion is genuinely the shortest',
    cross.list.every(x => moveCount(x.alg) >= cross.best), `best ${cross.best}`);

  /* ---------------- solutions written from a rotated grip ----------------
     The same eight quarter turns are the same eight quarter turns however the
     cube is held — but `B' U2 B U' B' U B` and `y R' U2 R U' R' U R` are not
     the same thing to reconstruct with, and only one of them is what anybody
     actually did. So a line that reads better after a rotation is offered as
     well, and a rotation costs nothing: it is not a move. */
  const atF2L = (() => {
    let p = C.applyAlg(C.SOLVED, scr);
    for (let i = 0; i < 4; i++) {
      const a = C.analyse(p.state, 'D');
      if (a.phase === 'f2l') return { pos: p, a };
      const r = SV.suggest(p.state, p.frame, a, { limit: 1 });
      if (!r.list.length) return null;
      p = C.applyAlg(p.state, r.list[0].alg, p.frame);
    }
    return null;
  })();
  check('a position with the cross done was reached to ask about pairs', !!atF2L);

  const f2l = atF2L ? SV.suggest(atF2L.pos.state, atF2L.pos.frame, atF2L.a, { limit: 30 })
                    : { list: [], best: -1 };
  const rotated = f2l.list.filter(x => /^[xyz]/.test(x.alg));
  check('pairs are offered from a rotated grip too', rotated.length > 0,
    `${rotated.length} rotated of ${f2l.list.length}`);
  check('a rotation is free — a rotated line is no longer than the shortest',
    f2l.list.every(x => moveCount(x.alg) >= f2l.best), `best ${f2l.best}`);

  /* A rotated line finishes a differently-named slot: an FR pair is the BR pair
     once you have turned the cube. Naming it the old way is worse than not
     naming it at all, so every row is checked against the pair it really puts
     in — from the orientation its own rotation leaves you in. */
  const mislabelled = [];
  if (atF2L) {
    const wasDone = atF2L.a.slots.filter(s => s.done).map(s => s.label);
    for (const x of f2l.list) {
      const rot = x.alg.split(/\s+/).filter(t => /^[xyz]/.test(t)).join(' ');
      const rf = rot ? C.applyAlg(atF2L.pos.state, rot, atF2L.pos.frame).frame : atF2L.pos.frame;
      const after = C.applyAlg(atF2L.pos.state, x.alg, atF2L.pos.frame);
      if (!after) { mislabelled.push(`${x.alg}: unreadable`); continue; }
      const gained = C.analyse(after.state, 'D').slots
        .filter(s => s.done && !wasDone.includes(s.label));
      if (gained.length < 1) { mislabelled.push(`${x.alg}: puts no pair in`); continue; }
      const names = gained.map(g => [...g.label].map(fc => C.toUserFace(rf, fc)).join(''));
      if (!names.some(n => x.label.startsWith(`${n} `))) {
        mislabelled.push(`${x.alg}: called "${x.label}", inserts ${names.join('/')}`);
      }
    }
  }
  check('every pair suggestion inserts, and names, the pair it claims',
    !mislabelled.length, mislabelled.slice(0, 3).join(' | ') || `${f2l.list.length} checked`);
}

/* ---------------- how moves group into steps ----------------
   A reconstruction is read one line per idea: the cross, then a line for each
   pair. What decides where a line breaks is whether anything actually went in
   — not whether the move was typed or picked off the list. Clicking the alg
   the panel just suggested for the pair you are already working on has to land
   on that pair's line. */
section('reconstruction steps');
{
  const R = await import('./js/recon.js');
  // rank is how far through the solve the line *started*: 0 before the cross,
  // 1-4 as the pairs go in. Equal rank means nothing has gone in since.
  check('a suggestion you clicked continues the line it belongs to',
    R.joinsLast({ alg: "U'", rank: 1, typed: true }, 1) === true &&
    R.joinsLast({ alg: "R U R'", rank: 1, typed: false }, 1) === true);
  check('a pair going in starts the next line',
    R.joinsLast({ alg: "R U R'", rank: 1, typed: false }, 2) === false &&
    R.joinsLast({ alg: 'F R U R2', rank: 0, typed: true }, 1) === false);
  check('a rotation is never a step of its own',
    R.joinsLast({ alg: 'y', rank: 1, typed: true }, 2) === true &&
    R.joinsLast({ alg: "x2 y'", rank: 0, typed: false }, 1) === true);
  check('the first move starts the first line', R.joinsLast(null, 0) === false);

  /* ---------------- which face am I looking at? ----------------
     Drag the cube round to find a piece and R, U and F are wherever they ended
     up. The letters follow the camera, so they are worked out from where it is
     rather than from anything the cube was asked to do. */
  const spots = (lat, lon) => Object.fromEntries(R.faceSpots(lat, lon).map(s => [s.face, s]));
  const home = spots(35, 30);
  check('at the default view U is up, D is down and R is to the right',
    home.U.y < -0.5 && home.D.y > 0.5 && home.R.x > 0.4 && home.L.x < -0.4,
    `U(${home.U.x.toFixed(2)}, ${home.U.y.toFixed(2)}) R(${home.R.x.toFixed(2)}, ${home.R.y.toFixed(2)})`);
  check('and U, F and R are the three faces you can see',
    home.U.front && home.F.front && home.R.front &&
    !home.D.front && !home.B.front && !home.L.front);
  check('turn all the way round and it is B you are looking at',
    spots(35, 210).B.front && !spots(35, 210).F.front);
  check('look from underneath and D is the face towards you',
    spots(-80, 30).D.front && !spots(-80, 30).U.front);
}

/* ---------------- the last-layer libraries ----------------
   Two thousand algs scraped off a website is two thousand chances to ship one
   that does not work, and a suggestion that does not work is worse than no
   suggestion. So every one of them is checked here, against the same model the
   panel reasons with. */
section('last layer libraries');
{
  const C = await import('./js/cube3.js');
  const A = await import('./js/algsets.js');

  const eq = (a, b) => [...a].every((v, i) => v === b[i]);

  /** The position `alg` is the solution to, worked out from what it does. */
  const caseFor = (alg) => {
    const got = C.applyAlg(C.SOLVED, alg);
    if (!got) return null;
    const x = got.state, y = new Uint8Array(40);
    for (let i = 0; i < 8; i++) { const p = x[i]; y[p] = i; y[8 + p] = (3 - x[8 + i]) % 3; }
    for (let i = 0; i < 12; i++) { const p = x[16 + i]; y[16 + p] = i; y[28 + p] = x[28 + i]; }
    const back = C.applyAlg(y, alg);
    return back && eq(back.state, C.SOLVED) ? y : null;
  };

  const audit = (name, algs, wants) => {
    const bad = [];
    let n = 0;
    for (const [id, list] of algs) {
      for (const alg of list) {
        n++;
        const c = caseFor(alg);
        const why = !c ? 'does not solve itself'
          : !C.analyse(c, 'D').f2l ? 'breaks f2l'
          : wants(C.analyse(c, 'D')) ? null : 'wrong kind of case';
        if (why) bad.push(`${id}: ${alg} (${why})`);
      }
    }
    check(`every ${name} alg solves the case it is filed under`, !bad.length,
      bad.length ? bad.slice(0, 3).join(' | ') : `${n} algs, ${algs.length} cases`);
  };

  audit('OLL', Object.entries(A.OLL_ALGS), a => a.phase === 'oll');
  audit('PLL', Object.entries(A.PLL_ALGS), a => a.phase === 'pll');
  audit('ZBLL', A.ZBLL.map(z => [z.name, z.algs]), a => a.phase === 'oll' && a.eo);

  check('ZBLL covers the whole set', A.ZBLL.length === 472, `${A.ZBLL.length} cases`);
  check('every OLL and PLL case has more than one spelling',
    Object.values(A.OLL_ALGS).every(v => v.length > 1) &&
    Object.values(A.PLL_ALGS).every(v => v.length > 1),
    `OLL ${Object.values(A.OLL_ALGS).reduce((n, v) => n + v.length, 0)} algs, ` +
    `PLL ${Object.values(A.PLL_ALGS).reduce((n, v) => n + v.length, 0)} algs`);

  /* The notation the cube preview is handed. RW is a wide turn to this app and
     a syntax error to twisty-player, which is what used to stop the cube dead
     the moment somebody typed one. */
  check('caps and lowercase wide turns both come out as Rw',
    C.canonical('RW') === 'Rw' && C.canonical('rw') === 'Rw' && C.canonical("RW'") === "Rw'"
    && C.canonical('X2') === 'x2' && C.canonical("R2'") === 'R2');
  check('tidying the notation never changes the turn',
    ['RW', "LW2", 'UW', "M2", "r U R' U' Rw2 F"].every(a =>
      eq(C.applyAlg(C.SOLVED, a).state, C.applyAlg(C.SOLVED, C.canonical(a)).state)));
}

/* ---------------- ZBLL, offered where it belongs ---------------- */
section('zbll recognition');
{
  const C = await import('./js/cube3.js');
  const SV = await import('./js/solver.js');
  const eq = (a, b) => [...a].every((v, i) => v === b[i]);

  // A Sune case: corners twisted, edges already up. That is a ZBLL position.
  const sune = C.applyAlg(C.SOLVED, "R U2 R' U' R U' R' U' R U R' F' R U R' U' R' F R2 U' R'");
  const a1 = C.analyse(sune.state, 'D');
  check('an OLL with its edges up is recognised as a ZBLL case',
    a1.phase === 'oll' && a1.eo, `phase ${a1.phase}, eo ${a1.eo}`);
  const r1 = SV.suggest(sune.state, sune.frame, a1, { limit: 20 });
  check('the panel offers one-alg finishes for it', r1.zb && r1.list.some(x => x.kind === 'ZBLL'),
    `${r1.list.filter(x => x.kind === 'ZBLL').length} ZBLL suggestions`);
  check('and every one of them really does finish the solve',
    r1.list.filter(x => x.kind === 'ZBLL')
      .every(x => eq(C.applyAlg(sune.state, x.alg, sune.frame).state, C.SOLVED)));
  check('the ZBLL suggestions come first', r1.list[0]?.kind === 'ZBLL');

  // The same corners with an edge flipped is not a ZBLL case, and must not
  // be sold as one.
  const flipped = C.applyAlg(sune.state, "F R U R' U' F'", sune.frame);
  const a2 = C.analyse(flipped.state, 'D');
  const r2 = SV.suggest(flipped.state, flipped.frame, a2, { limit: 20 });
  check('an OLL with a flipped edge is not offered a one-alg finish',
    !a2.eo && !r2.zb && !r2.list.some(x => x.kind === 'ZBLL'));

  // Multiple spellings of the case somebody actually used.
  check('an OLL position comes back with more than one alg to choose from',
    r2.list.filter(x => x.kind === 'OLL').length > 1,
    `${r2.list.filter(x => x.kind === 'OLL').length} OLL algs offered`);
  check('every OLL suggestion orients the last layer',
    r2.list.filter(x => x.kind === 'OLL')
      .every(x => C.analyse(C.applyAlg(flipped.state, x.alg, flipped.frame).state, 'D').oll));

  /* A PLL skip. No alg in the PLL list permutes nothing, so the only answer
     here is the AUF — and the panel used to say it had run out of ideas one
     turn from a finished solve. */
  const skip = C.applyAlg(C.SOLVED, 'U2');
  const a3 = C.analyse(skip.state, 'D');
  const r3 = SV.suggest(skip.state, skip.frame, a3, { limit: 5 });
  check('a permuted last layer is offered its AUF, not nothing',
    a3.phase === 'pll' && r3.list.length > 0 && r3.best === 1,
    r3.list[0] ? `${r3.list[0].alg} · ${r3.list[0].label}` : 'nothing offered');
  check('and the AUF really does finish it',
    !!r3.list.length && eq(C.applyAlg(skip.state, r3.list[0].alg, skip.frame).state, C.SOLVED));
}

/* ---------------- the real page, in an iframe ---------------- */
section('the app as actually rendered');
await new Promise((resolve) => {
  const f = document.createElement('iframe');
  f.style.cssText = 'width:1200px;height:800px;border:0;position:absolute;left:-9999px;top:0';
  f.src = 'index.html?selftest=1';
  // Wait for the app to actually settle rather than guessing a delay — this
  // page is loading cubing.js too, so the iframe's first scramble can be slow.
  f.onload = () => {
    const started = Date.now();
    const ready = () => {
      const d = f.contentDocument;
      const txt = (d?.querySelector('#scramble-text')?.textContent || '').trim();
      return (f.contentWindow?.__tdtBooted && txt && !/warming up|generating/i.test(txt))
             || Date.now() - started > 20000;
    };
    const tick = () => ready() ? run() : setTimeout(tick, 250);
    setTimeout(tick, 500);
  };
  const run = async () => {
    const d = f.contentDocument, w = f.contentWindow;
    const shown = sel => {
      const e = d.querySelector(sel);
      if (!e) return false;
      const cs = w.getComputedStyle(e), r = e.getBoundingClientRect();
      return cs.display !== 'none' && cs.visibility !== 'hidden' && r.width > 0 && r.height > 0;
    };
    // Regression guard: `#id { display: flex }` beats the UA's [hidden] rule,
    // which once left the command palette permanently covering the whole app.
    const overlays = ['#palette', '#drawer', '#scrim', '#popover', '#cube-fallback',
                      '#inspect-readout', '#pace-ghost', '#last-delta', '#case-label', '#boot-error'];
    const leaking = overlays.filter(shown);
    check('no overlay is visible when the app is idle', leaking.length === 0, leaking.join(' ') || `${overlays.length} checked`);

    const centre = d.elementFromPoint(600, 400);
    const cid = centre ? (centre.id || centre.className || centre.tagName) : 'none';
    check('nothing is covering the middle of the screen',
      !/palette|drawer|scrim|boot-error/.test(cid), 'topmost: ' + cid);

    check('the app booted', w.__tdtBooted === true);

    // Regression guard: an animation keyframe starting at opacity 0 left the
    // scramble invisible whenever the timeline was paused.
    const sc = d.querySelector('#scramble-text');
    const scBox = sc.getBoundingClientRect();
    const scOpacity = parseFloat(w.getComputedStyle(sc).opacity);
    check('the scramble is actually visible',
      scOpacity > 0.9 && scBox.width > 0 && scBox.height > 0,
      `opacity ${scOpacity}`);

    // Regression guard: the timer centred inside the leftover column instead of
    // the screen, so it sat half a sidebar to the right.
    const tBox = d.querySelector('#timer-display').getBoundingClientRect();
    const tCentre = tBox.x + tBox.width / 2;
    const want = w.innerWidth / 2;
    check('the timer is centred on screen',
      Math.abs(tCentre - want) <= 2, `centre ${Math.round(tCentre)}, want ${Math.round(want)}`);

    check('the page does not scroll sideways',
      d.documentElement.scrollWidth <= w.innerWidth + 1,
      `${d.documentElement.scrollWidth - w.innerWidth}px over`);
    check('a scramble was generated',
      (d.querySelector('#scramble-text').textContent || '').trim().split(/\s+/).length > 5,
      d.querySelector('#scramble-text').textContent.slice(0, 30));

    /* ---------------- the SOTD chip in the top bar ----------------
       An invitation that is still sitting there after you have accepted it is
       clutter, so the chip goes once today's attempt is in — and comes back
       when the day rolls over, which is the half that is easy to get wrong by
       storing a boolean instead of a date. */
    {
      const chip = d.querySelector('#btn-daily');
      const shownChip = () => {
        const cs = w.getComputedStyle(chip), r = chip.getBoundingClientRect();
        return cs.display !== 'none' && r.width > 0 && r.height > 0;
      };
      const note = (v) => {
        v === null ? w.localStorage.removeItem('tdt.sotd.doneDay')
                   : w.localStorage.setItem('tdt.sotd.doneDay', v);
        w.dispatchEvent(new w.CustomEvent('sotd-done'));
      };
      const today = (await import('./js/dayid.js')).dayIdFromServerMs(Date.now());

      const shining = () => w.getComputedStyle(chip, '::after').content !== 'none';
      const labelled = () => {
        const l = chip.querySelector('.sotd-label');
        return !!l && w.getComputedStyle(l).display !== 'none';
      };

      note(null);
      check('before you have played, the chip advertises itself: labelled and shining',
        shownChip() && labelled() && shining() && /SOTD/.test(chip.textContent),
        chip.textContent.trim());

      note(today);
      /* The bug this exists for: the chip used to be hidden outright once you
         had submitted, which removed the ONLY way back into the window — so
         the board you had just earned a place on could not be looked at again
         until midnight. Stopping the advertisement and taking away the door
         are different things, and only the first was ever wanted. */
      check('once today’s attempt is in, the way back into the window is still there',
        shownChip(), 'the chip is the only route to the board');
      check('…but it has stopped advertising itself — no label, no shine',
        !labelled() && !shining(),
        `label ${labelled()}, shine ${shining()}`);

      /* The one a boolean would fail: yesterday's note must not still be
         suppressing today's invitation. */
      note('1999-01-01');
      check('yesterday’s attempt does not retire today’s chip',
        shownChip() && labelled() && shining());

      note(null);
      check('no note at all leaves the chip inviting', shownChip() && labelled() && shining());

      /* The note belongs to the browser, not to the account, so something has
         to throw it away when the account goes — otherwise signing out left
         the chip retired for a visitor who has no attempt in, cannot have
         one, and is precisely the person the gold is for. clearSotdDone() is
         what sign-out, boot-without-a-session and a database that disagrees
         all call; it must both forget the note and say so, since the chip is
         drawn from the event rather than by polling. */
      note(today);
      const { clearSotdDone } = await import('./js/dayid.js');
      /* The module under test is this page's copy, so its announcement lands
         on this window; the note itself is localStorage, which the frame
         shares. So: call it here, then hand the frame the same event the real
         one would have raised inside it and look at the chip. */
      let announced = false;
      const hear = () => { announced = true; };
      window.addEventListener('sotd-done', hear);
      clearSotdDone();
      window.removeEventListener('sotd-done', hear);
      w.dispatchEvent(new w.CustomEvent('sotd-done'));
      check('signing out un-retires the chip, and announces it',
        announced && !w.localStorage.getItem('tdt.sotd.doneDay')
          && shownChip() && labelled() && shining(),
        `announced ${announced}, note ${w.localStorage.getItem('tdt.sotd.doneDay')}`);
    }

    /* ---------------- one scramble a day, for everybody ----------------

       The single promise the whole feature makes. It broke because
       `snap.scramble === null` was read as "nobody has published today's"
       when it also means "the listener has not delivered its first value
       yet" — and watch() emits once before that happens. Every refresh then
       raced its own read, the winner generated and wrote a brand new
       scramble, and the day's scramble changed under everyone.

       Driven through a stub transport rather than Firebase: what is being
       checked is the controller's decision to publish at all, and that
       decision is made before anything touches the network. */
    {
      const { Daily } = await import('./js/daily.js');

      const makeCtl = (snapPatch) => {
        const ctl = new Daily({ settings: { event: '333', inputMode: 'timer' }, nextScramble: () => {} });
        ctl.snap = {
          event: '333', dayId: '2026-09-08', uid: 'u1', signedIn: true,
          scramble: null, scrambleLoaded: false, progress: {}, results: {},
          ...snapPatch,
        };
        ctl.net = {
          published: [],
          publishScramble(s) { this.published.push(s); return Promise.resolve({ ok: true }); },
          hasOwnResult: () => Promise.resolve(false),
          unlockResults() {},
          setProgress: () => Promise.resolve(),
        };
        return ctl;
      };

      const settle = () => new Promise(r => setTimeout(r, 400));

      /* First, so the random-state generator is warm before anything below is
         timed — a cold WASM load is seconds, and none of these checks are
         about how long generating takes. */
      const first = makeCtl({ scrambleLoaded: true, scramble: null });
      await first._maybePublishScramble();
      await settle();
      check('the first client of the day, having actually looked, does publish one',
        first.net.published.length === 1, `${first.net.published.length} write(s)`);

      const known = makeCtl({ scrambleLoaded: true, scramble: "R U R' U'" });
      await known._maybePublishScramble();
      await settle();
      check('a day that already has a scramble is never written over',
        known.net.published.length === 0, `${known.net.published.length} write(s)`);

      const racing = makeCtl({ scrambleLoaded: false });
      await racing._maybePublishScramble();
      check('a client that has not heard from the scramble node yet publishes nothing',
        racing.net.published.length === 0,
        `${racing.net.published.length} write(s) — each one is a new scramble for everybody`);

      /* …but standing aside must never be a dead end. The first version of
         that gate was a bare return, so a listener that never reported left
         the window on "Publishing today's scramble…" with no attempt made and
         no retry scheduled — a silent hang in place of the bug it fixed. The
         wait is bounded, and the transaction is what actually keeps the write
         once, so a node that will not report is published to anyway. */
      for (let i = 0; i < 40 && racing.net.published.length === 0; i++) await settle();
      check('a scramble node that never reports is waited on, then published to anyway',
        racing.net.published.length === 1,
        `${racing.net.published.length} write(s) after the wait ran out`);
    }

    /* ---------------- the Scramble of the Day window, as it renders ----------------

       The point of this window is subtraction: it is worth having only if the
       rest of the app genuinely goes away and the two things you need are
       genuinely still there. Both halves are measured off the laid-out page,
       because "the class is on <body>" says nothing about what a viewer can
       actually see -- a rule that lost a specificity fight leaves the sidebar
       sitting there with the class applied and the DOM looking correct. */
    {
      const chrome = ['#topbar', '#sidebar', '#sidebar-right', '#dock-bottom', '#tile-float-layer'];
      const box = sel => d.querySelector(sel)?.getBoundingClientRect() || { width: 0, height: 0 };
      const visible = sel => {
        const e = d.querySelector(sel);
        if (!e) return false;
        const cs = w.getComputedStyle(e), r = e.getBoundingClientRect();
        return cs.display !== 'none' && cs.visibility !== 'hidden'
               && parseFloat(cs.opacity) > 0.05 && r.width > 0 && r.height > 0;
      };

      const typeSize = () => parseFloat(w.getComputedStyle(d.querySelector('#scramble-text')).fontSize);
      const beforeType = typeSize();
      const beforeChrome = chrome.filter(visible).join(' ');
      d.body.classList.add('sotd');
      /* The app re-measures the scramble on resize (main.js's debounced
         refit), which is the same path entering the window really takes —
         the type is sized to the room available, so the room changing has
         to be what re-sizes it. */
      w.dispatchEvent(new Event('resize'));
      await new Promise(r => setTimeout(r, 600));

      const stillThere = chrome.filter(visible);
      check('the Scramble of the Day window hides the rest of the app',
        stillThere.length === 0, stillThere.join(' ') || `${chrome.length} checked`);

      check('the scramble and the timer survive into the window',
        visible('#scramble-text') && visible('#timer-display'),
        `scramble ${visible('#scramble-text')}, timer ${visible('#timer-display')}`);

      /* The window exists to make the scramble the thing you look at, so the
         type has to get BIGGER, not merely survive. Measured as font size
         rather than as the text's own box: bigger type wraps sooner, so the
         box can narrow at the exact moment the letters grow. */
      const inWindow = typeSize();
      check('the scramble is set larger inside the window than outside it',
        inWindow > beforeType && box('#scramble-text').height > 0,
        `${beforeType.toFixed(1)}px -> ${inWindow.toFixed(1)}px`);

      /* And still fits: a boost that runs a 5x5 scramble off the side of the
         screen would be a worse window than no window. */
      const st = d.querySelector('#scramble-text');
      check('the enlarged scramble still fits the width it is given',
        st.scrollWidth <= st.clientWidth + 2,
        `${st.scrollWidth}px of text through ${st.clientWidth}px`);

      // Its own header -- the day, the countdown and the way out -- is the only
      // chrome the window keeps, and a window with no way out is a trap.
      check('the window keeps its own header, with a way back out',
        visible('#sotd-bar') && visible('#sotd-exit'));

      /* The board shares the screen with the two things the window exists to
         show, and "shares" has to mean beside, not on top of. Both of these
         were real: the board covered the timer badly enough that the time you
         had just done had to be dimmed to 12% to let the list through, and a
         later fix moved the scramble instead and made it smaller than it is
         outside the window. Geometry, because that is what went wrong. */
      const overlaps = (a, b2) => !(a.right <= b2.left || a.left >= b2.right
                                 || a.bottom <= b2.top || a.top >= b2.bottom);
      const rect = sel => d.querySelector(sel).getBoundingClientRect();
      check('the board does not cover the scramble',
        !overlaps(rect('#sotd-board'), rect('#scramble-text')),
        `board top ${Math.round(rect('#sotd-board').top)}, scramble bottom ${Math.round(rect('#scramble-text').bottom)}`);
      check('the board does not cover the timer',
        !overlaps(rect('#sotd-board'), rect('#timer-display')),
        `board right ${Math.round(rect('#sotd-board').right)}, timer left ${Math.round(rect('#timer-display').left)}`);

      /* And the timer stays where it has always been. It was briefly nudged
         sideways to centre it in the space left over, which reads as a timer
         that has drifted rather than as a layout with a column in it. */
      const tb = rect('#timer-display');
      check('the timer is still centred on screen inside the window',
        Math.abs((tb.x + tb.width / 2) - w.innerWidth / 2) <= 2,
        `centre ${Math.round(tb.x + tb.width / 2)}, want ${Math.round(w.innerWidth / 2)}`);

      check('the window does not make the page scroll sideways',
        d.documentElement.scrollWidth <= w.innerWidth + 1,
        `${d.documentElement.scrollWidth - w.innerWidth}px over`);

      /* Leaving has to put the app back exactly as it was. A window that leaks
         one fixed-position layer over the idle timer is worse than no window:
         the check at the top of this section would start failing for reasons
         nobody could trace back to here. */
      d.body.classList.remove('sotd');
      await new Promise(r => setTimeout(r, 500));
      const left = ['#sotd-bar', '#sotd-board'].filter(visible);
      check('leaving the window puts the app back and leaves nothing on top',
        chrome.filter(visible).join(' ') === beforeChrome && left.length === 0,
        left.length ? 'still on top: ' + left.join(' ') : `chrome was "${beforeChrome}"`);
    }


    // Regression guard: the preview must end up as either a live player or a
    // visible "unavailable" message — never an empty gap.
    //
    // Note what this does NOT look at: twisty-player renders into a *closed*
    // shadow root, so `tp.shadowRoot` is null even when the cube is on screen
    // and painting. An earlier version of this check read that property, and
    // the app grew a watchdog to satisfy it that tore down a perfectly good
    // preview after 30 seconds. What is actually observable from out here is
    // that the element exists, is laid out, and got its puzzle.
    const cubeOk = await new Promise((res) => {
      const started = Date.now();
      const poll = async () => {
        const tp = d.querySelector('twisty-player');
        const fb = d.querySelector('#cube-fallback');
        const fallbackShown = !!(fb && !fb.hidden && d.defaultView.getComputedStyle(fb).display !== 'none');
        if (tp && tp.getBoundingClientRect().height > 0) {
          try {
            const puzzle = await tp.experimentalModel.puzzleLoader.get();
            return res({ ok: true, how: 'live player, puzzle ' + puzzle.id });
          } catch (err) {
            return res({ ok: false, how: 'player present but no puzzle: ' + err.message });
          }
        }
        if (fallbackShown) return res({ ok: true, how: 'fallback: ' + fb.querySelector('span')?.textContent });
        if (Date.now() - started > 10000) return res({ ok: false, how: 'neither rendered nor fell back' });
        setTimeout(poll, 250);
      };
      poll();
    });
    check('the cube preview either renders or visibly falls back — never sits there empty',
      cubeOk.ok, cubeOk.how);

    // The check above was not enough on its own: the preview once had a live
    // player, a loaded puzzle, and a correctly sized 150x150 host element while
    // painting into a canvas of height ZERO, because a stylesheet forced
    // `display: block` onto a host whose internal layout needs `grid`. Nothing
    // observable from the DOM said so. So measure the canvas itself.
    //
    // Two wrinkles: the canvas lives in a *closed* shadow root, so it is caught
    // by patching getContext rather than queried; and the player defers all
    // rendering behind an IntersectionObserver, which never fires in a headless
    // or non-compositing context, so the callback is invoked directly.
    const timerCanvases = [];
    const canvasOk = await (async () => {
      const tp = d.querySelector('#cube-holder twisty-player');
      if (!tp) return { ok: true, how: 'no player — fallback path, already covered' };
      const seen = timerCanvases;
      const w = f.contentWindow;
      const orig = w.HTMLCanvasElement.prototype.getContext;
      w.HTMLCanvasElement.prototype.getContext = function (t, ...a) {
        if (!seen.includes(this)) seen.push(this);
        return orig.call(this, t, ...a);
      };
      let sym = null, o = tp;
      while (o && !sym) {
        for (const x of Object.getOwnPropertySymbols(o)) {
          if (String(x).includes('intersectedCallback')) sym = x;
        }
        o = Object.getPrototypeOf(o);
      }
      if (sym) tp[sym]();
      await new Promise(r => setTimeout(r, 5000));
      w.HTMLCanvasElement.prototype.getContext = orig;
      if (!seen.length) return { ok: false, how: 'the player never created a canvas' };
      const main = seen.map(c => c.getBoundingClientRect())
        .sort((a, b) => b.width * b.height - a.width * a.height)[0];
      return {
        ok: main.height > 1 && main.width > 1,
        how: `canvas ${Math.round(main.width)}x${Math.round(main.height)}`,
      };
    })();
    check('the cube preview’s canvas has real width AND height', canvasOk.ok, canvasOk.how);

    /* ---------------- the reconstruction workbench, as it renders ----------------
       Everything here is measured off the laid-out page rather than read out of
       the DOM, because every one of these was a thing that was *there* and still
       could not be seen: a share button reduced to an unlabelled icon in a bar
       nobody looks at, a scramble set in a size you have to lean in for, and a
       list squeezed to a sliver on a narrow screen. */
    /* Watch for the canvas the workbench's cube paints into, from before it is
       asked for.

       A twisty-player can be laid out at exactly the right size and still paint
       nothing — a black square where the cube should be, with nothing in the DOM
       to say so. Inserting the player as the first child of its stage is enough
       to do it, and when it happens the player never gets as far as asking for a
       drawing context at all. So that is what is checked: opening the workbench
       has to bring a new canvas into existence, and the timer's own — which goes
       on redrawing throughout — does not count. */
    const reconCanvases = [];
    const origGetContext = w.HTMLCanvasElement.prototype.getContext;
    w.HTMLCanvasElement.prototype.getContext = function (t, ...a) {
      if (!reconCanvases.includes(this)) reconCanvases.push(this);
      return origGetContext.call(this, t, ...a);
    };

    d.querySelector('#btn-recon').click();
    const rcHost = await new Promise((res) => {
      const t0 = Date.now();
      const poll = () => {
        const h = d.querySelector('#recon');
        // The player is mounted before the first paint of the panel, so waiting
        // on the step list alone hands back a workbench with no cube in it yet.
        if (h && !h.hidden && h.querySelector('.rc-steps')
            && h.querySelector('twisty-player, .rc-nocube')) return res(h);
        if (Date.now() - t0 > 15000) return res(null);
        setTimeout(poll, 200);
      };
      poll();
    });
    check('the reconstruction workbench opens', !!rcHost);

    if (rcHost) {
      const rbox = (sel) => rcHost.querySelector(sel)?.getBoundingClientRect() || null;
      const onScreen = (b) => !!b && b.width > 0 && b.height > 0
        && b.right > 0 && b.bottom > 0 && b.left < w.innerWidth && b.top < w.innerHeight;

      const rcPlayer = rcHost.querySelector('twisty-player');
      const rcCanvas = await (async () => {
        if (!rcPlayer) return { ok: false, how: 'no player in the workbench at all' };
        /* The same intersectedCallback poke as the check above, and for the
           same reason: this iframe is parked off-screen, so the player's own
           IntersectionObserver never fires here and it would otherwise never
           draw anything at all. That is also the limit of this check — a
           player that never gets told it is on screen is one it cannot see,
           because it does the telling. What it does catch is the workbench
           losing its player entirely, never getting a drawing context, and the
           zero-height canvas that a stray `display` rule on the host once
           caused on the timer's own preview. */
        let sym = null, o = rcPlayer;
        while (o && !sym) {
          for (const x of Object.getOwnPropertySymbols(o)) {
            if (String(x).includes('intersectedCallback')) sym = x;
          }
          o = Object.getPrototypeOf(o);
        }
        if (sym) rcPlayer[sym]();
        await new Promise(r => setTimeout(r, 4000));
        const mine = reconCanvases.filter(c => !timerCanvases.includes(c));
        if (!mine.length) return { ok: false, how: 'the workbench cube never asked for a canvas' };
        const main = mine.map(c => c.getBoundingClientRect())
          .sort((a, b) => b.width * b.height - a.width * a.height)[0];
        return { ok: main.width > 1 && main.height > 1, how: `canvas ${Math.round(main.width)}x${Math.round(main.height)}` };
      })();
      w.HTMLCanvasElement.prototype.getContext = origGetContext;
      check('the workbench cube actually paints, not just lays out', rcCanvas.ok, rcCanvas.how);

      check('the reconstruction screen carries the Tagda Timer logo',
        onScreen(rbox('.brand-mark')), JSON.stringify(rbox('.brand-mark')));

      /* Two of them, and both have to be there. The word next to the
         reconstruction is the one you can find without knowing the icon; the
         icon in the top bar is the one hands already go to, and moving it there
         from here is how it went missing in the first place. */
      const share = rcHost.querySelector('.rc-share');
      check('the share button is on screen and says what it is',
        onScreen(share?.getBoundingClientRect()) && /share/i.test(share?.textContent || ''),
        share ? `"${share.textContent.trim()}"` : 'no .rc-share');
      const shareIcon = rcHost.querySelector('.rc-share-icon');
      check('and share is still up in the top bar, where it always was',
        onScreen(shareIcon?.getBoundingClientRect())
        && /share/i.test(shareIcon?.getAttribute('aria-label') || ''),
        shareIcon ? `"${shareIcon.getAttribute('aria-label')}"` : 'no .rc-share-icon');

      const echo = rcHost.querySelector('.rc-cube-scramble');
      const echoSize = parseFloat(w.getComputedStyle(echo).fontSize);
      check('the scramble above the cube is big enough to read',
        echoSize >= 15 && onScreen(echo.getBoundingClientRect()), `${echoSize}px`);

      /* A whole solve in, so the list has something to be squeezed. The move
         box commits on a trailing space, which is the path a person's typing
         takes. */
      const scrBox = rcHost.querySelector('#rc-scramble');
      scrBox.value = "U2 F' U2 R L U F R B' R2 L2 F D2 F U2 R2 B' U2 B L2 R'";
      scrBox.dispatchEvent(new w.Event('change', { bubbles: true }));
      await new Promise(r => setTimeout(r, 900));
      const inp = rcHost.querySelector('.rc-entry .rc-inp');
      for (const mv of "z2 B L F' U F2 R' R L' U2 L R' y R' U2 R U' R' U R U2 D R U' R' D' U' R U' R'".split(' ')) {
        inp.value = `${mv} `;
        inp.dispatchEvent(new w.Event('input', { bubbles: true }));
      }
      await new Promise(r => setTimeout(r, 700));

      /* One line per pair, set-up turns included. `U' R U' R'` is one idea —
         the U' puts the pair where the alg can take it — and it used to come
         out as two lines, because the alg had been clicked rather than typed. */
      const lines = [...rcHost.querySelectorAll('.rc-step:not(.current) .mv')].map(e => e.textContent);
      check('each pair is one line, the turns that set it up included',
        lines.join(' | ') === "z2 B L F' U F2 R' | R L' U2 L R' | y R' U2 R U' R' U R | U2 D R U' R' D' | U' R U' R'",
        lines.join(' | ') || 'no steps');

      /* Five lines of reconstruction and a panel with room for three, so the
         line you are on sits below the fold. Measured on the desktop layout,
         because that is where it happens: the right-hand column is a fixed
         height there, and the list is the thing that gets squeezed. */
      const steps = rcHost.querySelector('.rc-steps');
      const sb = steps.getBoundingClientRect();
      const cur = rcHost.querySelector('.rc-step.current')?.getBoundingClientRect();
      check('the whole reconstruction fits the room it is given',
        steps.scrollHeight <= steps.clientHeight + 1,
        `${steps.scrollHeight}px of list through a ${steps.clientHeight}px window`);
      check('“you are here” is on screen, not cut off below the list',
        !!cur && cur.bottom <= sb.bottom + 1 && cur.top >= sb.top - 1,
        cur ? `row ${Math.round(cur.top)}-${Math.round(cur.bottom)} in ${Math.round(sb.top)}-${Math.round(sb.bottom)}`
            : 'no current row');

      // And on a phone, where the panels are as tall as what is in them.
      f.style.width = '420px';
      f.style.height = '860px';
      await new Promise(r => setTimeout(r, 700));
      const nb = steps.getBoundingClientRect();
      const ncur = rcHost.querySelector('.rc-step.current')?.getBoundingClientRect();
      check('and the same holds on a narrow screen',
        steps.scrollHeight <= steps.clientHeight + 1 && !!ncur && ncur.bottom <= nb.bottom + 1,
        `${steps.scrollHeight}px of list through a ${steps.clientHeight}px window`);
      f.style.width = '1200px';
      f.style.height = '800px';
    }

    f.remove();
    resolve();
  };
  document.body.append(f);
});


/* ---------------- blindfolded tracing ----------------

   The trace is checked by executing it. Every target is replayed as the
   swap it stands for — worked out from the piece arrays here, not from
   the sticker permutation the tracer itself uses — and the cube has to
   come out solved. A memo that does not solve the cube is not a memo.
   ---------------------------------------------------- */
section('blindfolded tracing');
{
  const C = await import('./js/cube3.js');
  const B = await import('./js/bldtrace.js');

  const SIZE = { corner: 3, edge: 2 };
  const OFF  = { corner: [0, 8], edge: [16, 28] };

  /** One shot: swap the buffer's piece with the target's, lining them up. */
  function swap(state, kind, buf, tgt) {
    const n = SIZE[kind];
    const [po, oo] = OFF[kind];
    const c1 = state[po + buf.slot], o1 = state[oo + buf.slot];
    const c2 = state[po + tgt.slot], o2 = state[oo + tgt.slot];
    // Which sticker of each cubie is currently showing at that slot index.
    const k1 = (buf.idx - o1 + n * 2) % n;
    const k2 = (tgt.idx - o2 + n * 2) % n;
    // Re-seat each piece so that same sticker shows at the other position.
    state[po + tgt.slot] = c1; state[oo + tgt.slot] = (tgt.idx - k1 + n * 2) % n;
    state[po + buf.slot] = c2; state[oo + buf.slot] = (buf.idx - k2 + n * 2) % n;
  }

  const solvedNow = (state) => C.facelets(state).every((c, i) => c === C.FACES[Math.floor(i / 9)]);

  /** Replay a whole trace and say whether the cube ends up solved. */
  function replay(scramble, bld) {
    const applied = C.applyAlg(C.SOLVED, scramble);
    if (!applied) return { ok: false, why: 'unreadable scramble' };
    const t = B.trace(scramble, bld);
    if (!t) return { ok: false, why: 'no trace' };
    const state = C.clone(applied.state);

    for (const [kind, group, bufName] of [
      ['edge', t.edges, t.buffers.edge],
      ['corner', t.corners, t.buffers.corner],
    ]) {
      const buf = kind === 'edge' ? B.edgeSticker(bufName) : B.cornerSticker(bufName);
      for (const tgt of group.targets) swap(state, kind, buf, { slot: tgt.slot, idx: tgt.idx });
    }
    return {
      ok: solvedNow(state),
      edges: t.edges.targets.length,
      corners: t.corners.targets.length,
      parity: t.parity,
      t,
    };
  }

  const speffz = { ...B.DEFAULT_BLD };

  /* --- a solved cube has nothing to say --- */
  const none = B.trace('', speffz);
  check('a solved cube traces to no targets at all',
    none.edges.targets.length === 0 && none.corners.targets.length === 0 && !none.parity);

  /* --- a hand-checkable single 3-cycle ---
     T perm swaps two corners and two edges, so with a UF/UFR buffer it is
     one short cycle on each half and parity on both. */
  const tperm = "R U R' U' R' F R2 U' R' U' R U R' F'";
  const tp = replay(tperm, speffz);
  check('a T perm traces to a memo that solves the cube', tp.ok,
    `${tp.edges} edge / ${tp.corners} corner targets`);
  check('a T perm is flagged as parity', tp.parity === true);

  /* --- a pure edge 3-cycle that leaves the buffer alone. UF is untouched by a
         U perm, so the memo has to break into the cycle: four targets for three
         moved pieces, not two, and the extra one is the whole cost of a break. --- */
  const uperm = "R2 U' R' U' R U R U R U' R";
  const up = replay(uperm, speffz);
  check('a U perm breaks into its cycle — four edge targets, no corner targets',
    up.corners === 0 && up.edges === 4, `${up.edges} edge / ${up.corners} corner`);
  check('a U perm flags the break that cost it that target',
    up.t.edges.breaks.length === 1, `breaks at ${up.t.edges.breaks.join()}`);
  check('a U perm is not parity', up.parity === false);
  check('a U perm memo solves the cube', up.ok);

  /* --- two flipped edges in place: four targets, and each flipped piece is shot
         at twice back to back, which is the case a piece-with-a-flag model gets
         wrong. Conjugated off UF so the buffer itself stays solved — a flipped
         buffer is its own shape and is covered by the random sweep below. --- */
  const flips = "U M' U M' U M' U2 M U M U M U2 U'";       // flips UL and UR in place
  const fl = replay(flips, speffz);
  check('two flipped edges in place trace to a memo that solves the cube', fl.ok,
    `${fl.edges} edge targets`);
  check('two flipped edges in place cost four targets', fl.edges === 4,
    fl.t.edges.targets.map(x => x.letter).join(' '));
  check('each flipped edge is marked as a second shot at the same piece',
    fl.t.edges.targets.filter(x => x.inPlace).length === 2);

  /* --- cycle breaks: a scramble whose edges do not all sit in one cycle --- */
  let sawBreak = false, sawParity = false, sawInPlace = false;
  let bad = 0, worst = 0;
  const RNG = ['R', 'U', 'F', 'L', 'D', 'B'];
  const SUF = ['', "'", '2'];
  for (let i = 0; i < 120; i++) {
    // A plain random-move scramble is enough: what is being tested is the
    // trace of a state, not how legal the scramble that made it was.
    const moves = [];
    let last = -1;
    while (moves.length < 25) {
      const a = Math.floor(Math.random() * 6);
      if (a === last) continue;
      last = a;
      moves.push(RNG[a] + SUF[Math.floor(Math.random() * 3)]);
    }
    const r = replay(moves.join(' '), speffz);
    if (!r.ok) bad++;
    worst = Math.max(worst, r.edges + r.corners);
    if (r.t.edges.breaks.length || r.t.corners.breaks.length) sawBreak = true;
    if (r.parity) sawParity = true;
    if (r.t.edges.targets.some(x => x.inPlace) || r.t.corners.targets.some(x => x.inPlace)) sawInPlace = true;
  }
  check('every one of 120 random scrambles traces to a memo that solves the cube',
    bad === 0, bad ? `${bad} failed` : `longest memo ${worst} targets`);
  check('cycle breaks turn up and are flagged', sawBreak);
  check('parity turns up across 120 scrambles', sawParity);
  check('flips and twists turn up and are flagged', sawInPlace);

  /* --- the buffer is a setting, not a constant --- */
  const altBuffer = { ...speffz, edgeBuffer: 'DF', cornerBuffer: 'DFL' };
  let badBuf = 0;
  for (let i = 0; i < 40; i++) {
    const moves = [];
    let last = -1;
    while (moves.length < 22) {
      const a = Math.floor(Math.random() * 6);
      if (a === last) continue;
      last = a;
      moves.push(RNG[a] + SUF[Math.floor(Math.random() * 3)]);
    }
    if (!replay(moves.join(' '), altBuffer).ok) badBuf++;
  }
  check('a different buffer still traces to a memo that solves the cube', badBuf === 0,
    badBuf ? `${badBuf} failed` : 'DF / DFL buffers');

  /* --- a scramble that ends in a rotation ---
     WCA 3BLD scrambles do, and the cube you are handed is the rotated one,
     so the letters must change with it while the memo still works. */
  const base = "R U R' F' U2 L' B L B2 U' R2 D2 F2 U2 F2";
  const rotated = base + " x2 y'";
  const a = B.trace(base, speffz);
  const b = B.trace(rotated, speffz);
  check('a trailing rotation still yields a memo that solves the cube', replay(rotated, speffz).ok);
  check('a trailing rotation changes the letters — the cube is handed to you turned',
    a.edges.targets.map(x => x.letter).join('') !== b.edges.targets.map(x => x.letter).join(''),
    `${a.edges.targets.map(x => x.letter).join('')} vs ${b.edges.targets.map(x => x.letter).join('')}`);
  check('a trailing rotation does not change how many targets there are',
    a.edges.targets.length === b.edges.targets.length
    && a.corners.targets.length === b.corners.targets.length);

  /* --- holding the cube the other way up relabels, nothing more --- */
  const yellowUp = { ...speffz, orientation: { up: 'D', front: 'F' } };
  const y = B.trace(base, yellowUp);
  check('a different scheme orientation keeps the same target count',
    y.edges.targets.length === a.edges.targets.length
    && y.corners.targets.length === a.corners.targets.length);
  check('a different scheme orientation still solves the cube', replay(base, yellowUp).ok);

  /* --- Speffz itself --- */
  const cs = Object.keys(B.DEFAULT_SPEFFZ_MAP).filter(k => k.length === 3);
  const es = Object.keys(B.DEFAULT_SPEFFZ_MAP).filter(k => k.length === 2);
  check('Speffz covers all 24 corner stickers exactly once',
    cs.length === 24 && new Set(cs.map(k => {
      const st = B.cornerSticker(k); return st.slot * 3 + st.idx;
    })).size === 24);
  check('Speffz covers all 24 edge stickers exactly once',
    es.length === 24 && new Set(es.map(k => {
      const st = B.edgeSticker(k); return st.slot * 2 + st.idx;
    })).size === 24);
  check('Speffz uses A-X once per piece type',
    new Set(cs.map(k => B.DEFAULT_SPEFFZ_MAP[k])).size === 24
    && new Set(es.map(k => B.DEFAULT_SPEFFZ_MAP[k])).size === 24);

  /* --- the post-mortem reads the stored memo, and says so when it cannot --- */
  const rec = B.traceRecord(tperm, speffz);
  check('a stored record keeps a letter and a slot for every target',
    rec.edges.letters.length === rec.edges.slots.length
    && rec.corners.letters.length === rec.corners.slots.length
    && rec.edges.letters.length > 0);
  const lines = B.diagnose({ ...rec }, [{ type: 'edge', slot: rec.edges.slots[0] }]);
  check('the post-mortem finds a piece that is in the memo',
    !!lines && lines.some(l => /target 1/.test(l)), lines ? lines[0].slice(0, 60) : 'none');
  const miss = B.diagnose({ ...rec }, [{ type: 'corner', slot: 99 }]);
  check('the post-mortem says so when a piece was never traced',
    !!miss && /never appear/.test(miss[0]));
}

/* ---------------- daily leaderboard: server-time day math ---------------- */
const D = await import('./js/daily-net.js');

section('daily leaderboard — day id and reset math');
{
  // 2026-09-07T18:29:59.999Z is one millisecond before 00:00 IST on the 8th.
  const justBefore = Date.parse('2026-09-07T18:29:59.999Z');
  const justAfter  = Date.parse('2026-09-07T18:30:00.000Z');
  check('the IST day rolls over at 18:30 UTC, not at UTC midnight',
    D.dayIdFromServerMs(justBefore) === '2026-09-07'
    && D.dayIdFromServerMs(justAfter) === '2026-09-08');

  check('a day id is stable across the day and does not depend on the machine timezone',
    D.dayIdFromServerMs(Date.parse('2026-09-08T00:00:00.000Z')) === '2026-09-08'
    && D.dayIdFromServerMs(Date.parse('2026-09-08T18:29:59.999Z')) === '2026-09-08');

  check('the next reset from just after a boundary is a full day away',
    D.nextResetMs(justAfter) - justAfter === 86400000);
  check('the next reset from just before a boundary is one millisecond away',
    D.nextResetMs(justBefore) - justBefore === 1);

  // A leap-day check: IST has no DST, so the offset is always exactly +5:30
  // and this arithmetic never needs a special case for it.
  check('the boundary math is exact across a leap day',
    D.dayIdFromServerMs(Date.parse('2028-02-28T18:30:00.000Z')) === '2028-02-29'
    && D.dayIdFromServerMs(Date.parse('2028-02-29T18:30:00.000Z')) === '2028-03-01');

  check('the countdown formats hours and minutes, floored to the minute',
    D.formatCountdown(4 * 3600000 + 12 * 60000 + 59000) === '4h 12m');
  check('the countdown reads as "less than a minute" rather than "0h 0m"',
    D.formatCountdown(45000) === 'under a minute');
  check('a negative or zero countdown never prints a negative time',
    D.formatCountdown(0) === 'under a minute' && D.formatCountdown(-5000) === 'under a minute');

  /* The database is keyed by this value, not by the "YYYY-MM-DD" label —
     see the comment on dayKeyFromServerMs for why: a security rule can
     compare a NUMBER against `now` to refuse a write to a day that hasn't
     started, and has no way to parse a date back out of a string. */
  check('the day key is the boundary\'s own epoch ms, a plain numeric string',
    D.dayKeyFromServerMs(justAfter) === String(D.dayStartMs('2026-09-08'))
    && /^-?\d+$/.test(D.dayKeyFromServerMs(justAfter)));
  check('the day key never reaches into the future: it is always <= the instant it was read at',
    Number(D.dayKeyFromServerMs(justAfter)) <= justAfter
    && Number(D.dayKeyFromServerMs(justBefore)) <= justBefore);
}

/* ---------------- scramble of the day: the solve-count board ----------------

   The "most solves today" board is not incremented per solve. Each client
   counts its OWN solve list against the day window and writes the total, and
   the rule only lets that number go up (see DAILY.md §5). That makes the
   count a pure function of the solve list, which is what these check --
   the transport around it has nothing to decide.
   ------------------------------------------------------------------- */

section('scramble of the day — the solve-count board');
{
  const dayStart = D.dayStartMs('2026-09-08');          // 2026-09-07T18:30:00Z
  const DAY = 86400000;
  const at = (ms, extra = {}) => ({ timeMs: 10000, penalty: 'none', createdAt: ms, ...extra });

  check('a solve inside the day window counts',
    D.countSolvesForDay([at(dayStart + 5000), at(dayStart + DAY - 1)], dayStart) === 2);

  /* The boundary is half-open: the instant the day starts belongs to the new
     day, the instant it ends belongs to the next one. Getting this wrong the
     other way would let one solve count on two consecutive boards. */
  check('the day window is half-open, so a boundary solve lands in exactly one day',
    D.countSolvesForDay([at(dayStart)], dayStart) === 1
    && D.countSolvesForDay([at(dayStart + DAY)], dayStart) === 0
    && D.countSolvesForDay([at(dayStart - 1)], dayStart) === 0);

  check('yesterday’s and tomorrow’s solves are not in today’s count',
    D.countSolvesForDay(
      [at(dayStart - DAY), at(dayStart + 1000), at(dayStart + DAY + 1000)], dayStart) === 1);

  /* This board is about volume, not speed: a DNF is still a solve you sat
     down and did, and dropping it would quietly punish blindfolded practice,
     where DNFs are most of the session. */
  check('a DNF or a +2 still counts as a solve done',
    D.countSolvesForDay(
      [at(dayStart + 1, { penalty: 'DNF' }), at(dayStart + 2, { penalty: '+2' })], dayStart) === 2);

  check('an empty or malformed solve list counts as zero rather than throwing',
    D.countSolvesForDay([], dayStart) === 0
    && D.countSolvesForDay(null, dayStart) === 0
    && D.countSolvesForDay([{}, { createdAt: null }], dayStart) === 0);
}

/* ---------------- the window's hold on the timer ----------------

   The bug these exist for: `locked()` returned `attempting`, the exact
   inverse of what it means in race.js. So the timer was held shut during the
   one solve it was supposed to be timing, and left wide open the rest of the
   time — which is what turned the whole window into an ordinary timer. Today's
