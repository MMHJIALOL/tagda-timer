   scramble could be "attempted" over and over, none of the attempts counting,
   nothing ever reaching the board, and the board therefore never unlocking.
   ------------------------------------------------------------------- */

section('scramble of the day — when the timer is held shut');
{
  const Daily = (await import('./js/daily.js')).Daily;
  const stub = () => new Daily({ settings: { event: '333' }, solves: [] });
  const at = (d, snap, extra = {}) => { d.snap = snap; Object.assign(d, extra); return d; };
  const live = { signedIn: true, scramble: "R U R' U'", dayId: '2026-09-08', uid: 'u1' };

  /* The most important one. Practising has nothing to do with the daily
     challenge, and a feature that can silently kill the timer of somebody who
     is not using it is worse than a feature that does not work. */
  check('outside the window the timer is never held shut, whatever the state',
    at(stub(), null).locked() === false
    && at(stub(), { signedIn: false }).locked() === false
    && at(stub(), live, { attempting: true }).locked() === false);

  check('inside the window an armed attempt leaves the timer OPEN — it is the solve being timed',
    at(Object.assign(stub(), { engaged: true }), live, { attempting: true }).locked() === false);

  check('inside the window the timer is shut until today’s scramble exists',
    at(Object.assign(stub(), { engaged: true }), { signedIn: true, scramble: null }).locked() === true);

  check('inside the window a signed-out visitor can watch but never time',
    at(Object.assign(stub(), { engaged: true }), { signedIn: false, scramble: "R U" }).locked() === true);

  /* One attempt per day is the whole premise, so this is the check that stops
     the same scramble being solved until a good time comes up. */
  check('once today’s attempt is submitted the timer shuts again',
    at(Object.assign(stub(), { engaged: true }), live, { submittedToday: true }).locked() === true);

  /* And what stands in for the scramble in each shut state, because the
     version that let the generator fill that gap is what made the window
     indistinguishable from an ordinary timer. */
  const held = (snap, extra) => at(Object.assign(stub(), { engaged: true }), snap, extra).takeScramble();
  /* Publishing used to be attempted only when a snapshot happened to arrive,
     so one failure on a quiet day meant no further attempt ever and the window
     sat on "Publishing today's scramble…" until it was reloaded. Three states
     used to share that one message; only the genuinely-in-flight one may now
     end in an ellipsis. */
  const pub = (extra) => at(Object.assign(stub(), { engaged: true }),
    { signedIn: true, scramble: null, dayId: '2026-09-08' }, extra);

  check('while attempts remain, the message says it is still trying',
    /Publishing today’s scramble…$/.test(pub({ _publishTries: 1 }).holdText()));

  check('once the attempts are spent it stops implying something is in flight',
    !/…$/.test(pub({ _publishTries: 9 }).holdText())
    && /could not be published/.test(pub({ _publishTries: 9 }).holdText()));

  check('an attempt still running is never reported as given up',
    pub({ _publishTries: 9, _publishing: true }).gaveUpPublishing() === false);

  check('the refusal reason is carried through to the reader, not just the console',
    /PERMISSION_DENIED/.test(pub({ _publishTries: 9, publishError: 'PERMISSION_DENIED' }).holdText()));

  /* A listener that errored has detached, so nothing will ever arrive on that
     node again — the one case where waiting is definitely pointless. */
  check('a board that cannot be read says so rather than waiting forever',
    /cannot be read/.test(at(Object.assign(stub(), { engaged: true }),
      { signedIn: true, scramble: null, readError: 'PERMISSION_DENIED' }).holdText()));

  check('a shut window shows a message where the notation goes, never a scramble',
    held({ signedIn: true, scramble: null }).hold === 'Publishing today’s scramble…'
    && held({ signedIn: false }).hold === 'Sign in to be given today’s scramble'
    && /already done today/.test(held(live, { submittedToday: true }).hold));

  check('a shut window never hands the timer a solvable scramble',
    ['scramble'].every(k => held({ signedIn: true, scramble: null })[k] === ''));

  check('an armed window hands over today’s scramble and nothing else',
    at(Object.assign(stub(), { engaged: true }), live, { attempting: true }).takeScramble().scramble
      === "R U R' U'");
}

section('scramble of the day — whose avatar URL is safe to fetch');
{
  /* A board row is written by somebody else and its `photo` becomes an <img
     src> in every viewer's browser, on a board that is public to read. An
     unrestricted string there is a tracking beacon anyone signed in can plant
     with no help from the app, so the URL is pinned to the host the account
     picture actually comes from. Same check as the .validate in
     firebase.rules.json — these are the cases that rule has to refuse. */
  const good = 'https://lh3.googleusercontent.com/a/ACg8ocK=s96-c';
  check('a real Google account picture is kept',
    D.safePhotoUrl(good) === good
    && D.safePhotoUrl('https://lh6.googleusercontent.com/a/x') !== null);

  check('somebody else’s server is refused, however plausible the path looks',
    D.safePhotoUrl('https://evil.example/lh3.googleusercontent.com/a.png') === null
    && D.safePhotoUrl('https://lh3.googleusercontent.com.evil.example/a.png') === null
    && D.safePhotoUrl('https://notlh3.googleusercontent.com/a.png') === null);

  check('a non-https scheme is refused, including the ones that are not fetches at all',
    D.safePhotoUrl('http://lh3.googleusercontent.com/a.png') === null
    && D.safePhotoUrl('//lh3.googleusercontent.com/a.png') === null
    && D.safePhotoUrl('javascript:alert(1)') === null
    && D.safePhotoUrl('data:image/svg+xml,<svg onload=alert(1)>') === null);

  check('a missing or malformed photo is simply no photo, never a throw',
    D.safePhotoUrl(null) === null && D.safePhotoUrl(undefined) === null
    && D.safePhotoUrl('') === null && D.safePhotoUrl({}) === null);

  // The filter has to survive the trip through the board builder too, or it
  // is only protecting the rows nobody was going to be attacked by.
  check('the count board strips a bad photo instead of passing it to an <img>',
    D.rankByCount({ u_a: { n: 2, name: 'Mallory', photo: 'https://evil.example/t.png' } }, null)[0].photo === null
    && D.rankByCount({ u_b: { n: 2, name: 'Real', photo: good } }, null)[0].photo === good);
}

section('scramble of the day — ranking the two boards');
{
  const counts = {
    u_ann:  { n: 12, name: 'Ann' },
    u_bob:  { n: 40, name: 'Bob' },
    u_cara: { n: 12, name: 'Cara' },
  };

  const byCount = D.rankByCount(counts, 'u_cara');
  check('the solve-count board is ranked by how many solves, most first',
    byCount.map(r => r.uid).join(' ') === 'u_bob u_ann u_cara',
    byCount.map(r => `${r.name}:${r.n}`).join(' '));

  /* A tie has to break the same way for everyone looking at the board, or two
     people compare screenshots and see different orders for the same data.
     Object key order is not a promise Firebase makes, so the name is. */
  check('a tie on count breaks by name, so every viewer sees the same order',
    D.rankByCount({ u_z: { n: 5, name: 'Zoe' }, u_a: { n: 5, name: 'Abe' } }, null)
      .map(r => r.name).join(' ') === 'Abe Zoe');

  check('the viewer’s own row is marked so the board can highlight it',
    byCount.filter(r => r.isMe).map(r => r.uid).join(' ') === 'u_cara');

  check('a missing name falls back rather than ranking as undefined',
    D.rankByCount({ u_x: { n: 3 } }, null)[0].name === 'Cuber');

  check('an empty count board is an empty list, not a throw',
    D.rankByCount(null, null).length === 0 && D.rankByCount({}, 'u_a').length === 0);
}

document.getElementById('summary').textContent =
  fail === 0 ? `All ${pass} checks passed.` : `${pass} passed, ${fail} FAILED.`;
document.getElementById('summary').style.color = fail === 0 ? '#3ddc84' : '#ff4d6d';
</script>
