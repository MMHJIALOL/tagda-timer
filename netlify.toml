# Tagda Timer is a plain static site — no build step, no server.
# `publish = "."` ships the folder as-is.
[build]
  publish = "."
  command = ""

# The vendored cubing.js bundle is content-hashed, so it can be cached forever.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The stylesheets are all three referenced from index.html with a ?v=, and
# browsers key the cache on the full URL including the query — so bumping ?v=
# is already a guaranteed miss and revalidating on top of it bought nothing.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The scripts cannot have the same treatment, and it is worth writing down why:
# only js/main.js is fetched with a ?v=. Every other module arrives through a
# bare ES import ("./util.js"), which resolves to an unversioned URL, so a
# deploy has no way to bust it. Marked immutable, those nineteen files would be
# frozen in every returning visitor's browser for a year. They revalidate.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Webfont files never change in place — if a face is ever replaced, give the
# new file a new name rather than editing this.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
