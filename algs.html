<!DOCTYPE html>
<html lang="en" data-theme="nebula">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alg Trainer — Tagda Timer</title>
<meta name="description" content="Algorithm sets for 3x3, 2x2, 4x4, one-handed, Pyraminx, Skewb and Square-1, shown as pictures — pick cases and drill them in the timer.">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Same ?v= discipline as index.html: bump every stylesheet here whenever
     anything under css/ changes, or a returning visitor renders this page
     against a year-old cached stylesheet. -->
<link rel="stylesheet" href="css/fonts.css?v=58">
<link rel="stylesheet" href="css/tokens.css?v=58">
<link rel="stylesheet" href="css/base.css?v=58">
<link rel="stylesheet" href="css/components.css?v=58">
<link rel="stylesheet" href="css/alglibrary.css?v=59">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/logo-192.png">
<link rel="apple-touch-icon" href="assets/logo-180.png">
<link rel="manifest" href="site.webmanifest">
</head>
<body class="alglib-page">

<header id="alglib-top">
  <a class="btn back" href="index.html">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <span>Timer</span>
  </a>
  <div class="alglib-title">
    <h1>Alg Trainer</h1>
    <p class="sub" id="alglib-sub"></p>
  </div>
</header>

<!-- Which puzzle, then which set. The set row is grouped by method. -->
<nav id="alglib-events" aria-label="Puzzle"></nav>
<nav id="alglib-tabs" aria-label="Algorithm set"></nav>

<!-- Search, subset, and the selection you are about to train — one sticky bar,
     so the count and the Train button stay in reach however far you scroll. -->
<div id="alglib-bar">
  <label class="alglib-search">
    <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="6.6"/><path d="M15.8 15.8L21 21"/></svg>
    <input id="alglib-q" type="search" placeholder="Search cases" autocomplete="off" spellcheck="false" aria-label="Search cases">
  </label>
  <div id="alglib-groups" hidden></div>
  <div id="alglib-train"></div>
</div>

<!-- Not a live region: a search keystroke would read out every card again.
     The selection count below is what gets announced. -->
<main id="alglib-grid"></main>
<p id="alglib-status" class="sr-status" aria-live="polite"></p>

<!-- The detail view replaces the grid rather than floating over it: on a phone
     a modal with a draggable list inside it fights the page for every scroll. -->
<main id="alglib-detail" hidden></main>

<footer id="alglib-foot">
  <span><b>Click</b> a picture to select a case · <b>Shift-click</b> to select everything in between · click the algorithm underneath to open it.</span>
</footer>

<div id="toasts"></div>

<script type="module" src="js/alglibrary-ui.js?v=58"></script>
</body>
</html>
