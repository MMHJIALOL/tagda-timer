<!DOCTYPE html>
<html lang="en" data-theme="nebula">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algorithm library — Tagda Timer</title>
<meta name="description" content="Every PLL and OLL case, shown as a picture, with community-ranked alternate algorithms you can reorder and add to.">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Same ?v= discipline as index.html: bump every stylesheet here whenever
     anything under css/ changes, or a returning visitor renders this page
     against a year-old cached stylesheet. -->
<link rel="stylesheet" href="css/fonts.css?v=40">
<link rel="stylesheet" href="css/tokens.css?v=40">
<link rel="stylesheet" href="css/base.css?v=40">
<link rel="stylesheet" href="css/components.css?v=40">
<link rel="stylesheet" href="css/alglibrary.css?v=40">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/logo-192.png">
<link rel="apple-touch-icon" href="assets/logo-180.png">
<link rel="manifest" href="site.webmanifest">
</head>
<body class="alglib-page">

<header id="alglib-top">
  <a class="btn back" href="index.html">
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg>
    <span>Timer</span>
  </a>
  <h1>Algorithm library</h1>
  <p class="sub" id="alglib-sub">Every case as a picture, with the alternates people actually use.</p>
</header>

<nav id="alglib-bar">
  <div class="seg" id="alglib-tabs" role="tablist">
    <button class="seg-btn" data-set="PLL" role="tab">PLL</button>
    <button class="seg-btn" data-set="OLL" role="tab">OLL</button>
  </div>
  <label class="alglib-search">
    <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="6.6"/><path d="M15.8 15.8L21 21"/></svg>
    <input id="alglib-q" type="search" placeholder="search name, letter or shape" autocomplete="off" spellcheck="false">
  </label>
</nav>

<main id="alglib-grid" aria-live="polite"></main>

<!-- The detail view replaces the grid rather than floating over it: on a phone
     a modal with a draggable list inside it fights the page for every scroll. -->
<main id="alglib-detail" hidden></main>

<footer id="alglib-foot">
  <span>Community ranking approximates what most speedcubers drill — it is not a claim that the first one suits your hands. Drag them into your order.</span>
</footer>

<div id="toasts"></div>

<script type="module" src="js/alglibrary-ui.js?v=40"></script>
</body>
</html>
