<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart cube · local demo</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#101019;color:#f0eefb;font:14px system-ui,sans-serif}
    header{flex:none;padding:16px 24px;background:#191826;border-bottom:1px solid #ffffff20;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
    h1{font-size:21px;margin:0 0 5px}p{margin:0;color:#b6b1cd}.intro{flex:1;min-width:260px}.badge{font-size:10px;letter-spacing:1.3px;color:#b8f6d5;display:block;margin-bottom:5px}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;font-weight:600;padding:11px 16px;border-radius:10px;border:1px solid #ffffff30;background:#28253b;color:#ede9ff;cursor:pointer}button.primary{background:#bba5ff;color:#191426;border-color:transparent}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid #d8caff;outline-offset:3px}
    #status{width:100%;font-size:12px;color:#c6c1db;min-height:17px}iframe{width:100%;flex:1;min-height:0;border:0;background:#111}
    @media(max-width:640px){header{padding:12px;gap:10px}h1{font-size:18px}.intro{min-width:100%}button{padding:9px 12px}p{font-size:12px}}
    header{display:grid;grid-template-columns:1fr auto;gap:3px 16px;padding:10px 18px}
    .intro{min-width:0}.intro .badge{display:none}h1{font-size:14px;display:flex;align-items:center;gap:9px;margin:0}h1::before{content:'LOCAL DEMO';font-size:8px;letter-spacing:1px;padding:3px 5px;border:1px solid #80b69a55;border-radius:4px;color:#a0d5b8}p{font-size:11px;margin-top:2px}
    .buttons{grid-column:2;grid-row:1 / 3}button{font-size:11px;padding:8px 11px;border-radius:7px}#status{grid-column:1;font-size:10px;min-height:14px}
    @media(max-width:640px){header{padding:9px 10px;gap:7px;grid-template-columns:1fr}.intro p{display:none}.buttons{grid-column:1;grid-row:2;flex-wrap:nowrap;gap:6px}.buttons button{font-size:10px;padding:8px 7px;white-space:nowrap}#status{grid-row:3}h1{font-size:13px}}
  </style>
</head>
<body>
  <header>
    <div class="intro"><span class="badge">LOCAL SIMULATION</span><h1>Try the smart cube.</h1><p>Simulated turns in the real timer. No cube or Bluetooth needed.</p></div>
    <div class="buttons"><button class="primary" id="run" disabled>Watch a solve</button><button id="mistake" disabled>Test a wrong turn</button><button id="review" disabled>Open analysis</button><button id="stop" disabled>Stop</button></div>
    <div id="status" role="status" aria-live="polite">Preparing the sample solve…</div>
  </header>
  <script>
    if(!['localhost','127.0.0.1'].includes(location.hostname)){
      document.getElementById('status').textContent='Open this demo using the local development server.';
    }else{
      localStorage.setItem('tdt-ann',JSON.stringify({feedback:{v:1,answer:'dismissed',shows:1},'webcam-replay':{v:1,answer:'dismissed',shows:1}}));
      const frame=document.createElement('iframe');frame.title='Tagda Timer smart cube demonstration';
      // This port is dedicated to local previews. A service worker left by a
      // previous test must not mix cached modules with the current stylesheet.
      (async()=>{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(registration=>registration.scope===`${location.origin}/`).map(registration=>registration.unregister()));
        }
        frame.src='./index.html?smartCubeDemo=1&ui=159';document.body.append(frame);
      })().catch(error=>{document.getElementById('status').textContent=`Could not load the preview: ${error.message}`;});
      const run=document.getElementById('run'),mistake=document.getElementById('mistake'),review=document.getElementById('review'),stop=document.getElementById('stop');
      for(const [button,action]of [[run,'run'],[mistake,'mistake'],[review,'review'],[stop,'stop']])button.onclick=()=>frame.contentWindow.postMessage({type:`smart-cube-demo-${action}`},location.origin);
      addEventListener('message',event=>{
        if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=='smart-cube-demo-status')return;
        document.getElementById('status').textContent=event.data.text;run.disabled=event.data.busy;mistake.disabled=event.data.busy;review.disabled=!event.data.ready||event.data.busy;stop.disabled=!event.data.busy;
      });
    }
  </script>
</body>
</html>
